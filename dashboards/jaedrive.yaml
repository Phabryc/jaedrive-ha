# JaeDrive dashboard for Home Assistant: built-in cards only, nothing to install.
#
# How to use it:
#   1. Settings > Dashboards > Add dashboard > "New dashboard from scratch", open it,
#      pencil (top right) > three dots > "Raw configuration editor".
#   2. Paste this whole file in place of what is there. Nothing to change.
#
# Card names come from the entities, so they follow the language of Home Assistant; only the
# section headings are fixed (in English). Entity ids are the same in every language.
# With a second car its ids end with "_2" (sensor.jaedrive_odometer_2, ...): duplicate the view
# and add "_2" to the ids.
# Plug-in hybrids and EVs: uncomment the "Electric" section at the bottom.
# Without the "location" permission the map and "Parked since" are missing: remove those cards.

title: JaeDrive
views:
  - title: Car
    path: car
    icon: mdi:car
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Now
            icon: mdi:car-info
          - type: tile
            entity: sensor.jaedrive_battery
            name:
              type: entity
          - type: tile
            entity: sensor.jaedrive_fuel_level
            name:
              type: entity
          - type: tile
            entity: sensor.jaedrive_fuel_range
            name:
              type: entity
          - type: tile
            entity: sensor.jaedrive_odometer
            name:
              type: entity
          - type: tile
            entity: sensor.jaedrive_status_updated
            name:
              type: entity
            grid_options:
              columns: 12

      - type: grid
        cards:
          - type: heading
            heading: Parking
            icon: mdi:parking
          - type: map
            entities:
              - entity: device_tracker.jaedrive_park
            default_zoom: 15
            hours_to_show: 0
            theme_mode: auto
          - type: tile
            entity: sensor.jaedrive_parked_at
            name:
              type: entity
            grid_options:
              columns: 12

      - type: grid
        cards:
          - type: heading
            heading: Last trip
            icon: mdi:map-marker-path
          - type: entities
            entities:
              - entity: sensor.jaedrive_last_trip_start
                name:
                  type: entity
              - entity: sensor.jaedrive_last_trip_end
                name:
                  type: entity
              - entity: sensor.jaedrive_last_trip_ended_at
                name:
                  type: entity
              - entity: sensor.jaedrive_last_trip_distance
                name:
                  type: entity
              - entity: sensor.jaedrive_last_trip_consumption
                name:
                  type: entity
              - entity: sensor.jaedrive_last_trip_fuel_used
                name:
                  type: entity
              - entity: sensor.jaedrive_last_trip_avg_speed
                name:
                  type: entity
              - entity: sensor.jaedrive_last_trip_duration
                name:
                  type: entity
              # Hybrids and EVs only: remove this row on petrol cars.
              - entity: sensor.jaedrive_last_trip_ev_share
                name:
                  type: entity

      - type: grid
        cards:
          - type: heading
            heading: Trip A
            icon: mdi:alpha-a-box-outline
          - type: entities
            entities:
              - entity: sensor.jaedrive_trip_a_distance
                name:
                  type: entity
              - entity: sensor.jaedrive_trip_a_consumption
                name:
                  type: entity
              - entity: sensor.jaedrive_trip_a_fuel_used
                name:
                  type: entity
              - entity: sensor.jaedrive_trip_a_since
                name:
                  type: entity
          - type: heading
            heading: Trip B
            icon: mdi:alpha-b-box-outline
          - type: entities
            entities:
              - entity: sensor.jaedrive_trip_b_distance
                name:
                  type: entity
              - entity: sensor.jaedrive_trip_b_consumption
                name:
                  type: entity
              - entity: sensor.jaedrive_trip_b_fuel_used
                name:
                  type: entity
              - entity: sensor.jaedrive_trip_b_since
                name:
                  type: entity

      - type: grid
        cards:
          - type: heading
            heading: Last 30 days
            icon: mdi:calendar-month
          - type: tile
            entity: sensor.jaedrive_distance_30d
            name:
              type: entity
          - type: tile
            entity: sensor.jaedrive_consumption_30d
            name:
              type: entity
          # Hybrids and EVs only: remove this card on petrol cars.
          - type: tile
            entity: sensor.jaedrive_ev_share_30d
            name:
              type: entity
          - type: statistics-graph
            entities:
              - sensor.jaedrive_odometer
            stat_types:
              - change
            chart_type: bar
            period: day
            days_to_show: 30
          - type: history-graph
            hours_to_show: 168
            entities:
              - sensor.jaedrive_battery
              - sensor.jaedrive_fuel_level

      - type: grid
        cards:
          - type: heading
            heading: Service and subscription
            icon: mdi:wrench-clock
          - type: tile
            entity: sensor.jaedrive_service_due_date
            name:
              type: entity
          - type: tile
            entity: binary_sensor.jaedrive_subscription_problem
            name:
              type: entity
          - type: tile
            entity: sensor.jaedrive_subscription_expires
            name:
              type: entity
            grid_options:
              columns: 12
          - type: tile
            entity: sensor.jaedrive_last_seen
            name:
              type: entity
            grid_options:
              columns: 12

