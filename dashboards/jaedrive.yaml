# Plancia JaeDrive pronta per Home Assistant: solo card standard, niente da installare.
#
# Come usarla:
#   1. Impostazioni > Plance > Aggiungi plancia > "Nuova plancia da zero", aprila,
#      matita in alto > tre puntini > "Editor di configurazione grezza".
#   2. Incolla tutto questo file al posto di quello che c'è: non c'è niente da cambiare.
#
# Gli entity_id sono gli stessi in ogni lingua di Home Assistant.
# Con più auto la seconda ha gli id con "_2" in fondo (sensor.jaedrive_odometer_2, ...):
# per lei duplica la vista e aggiungi "_2" agli id.
# Ibride plug-in ed elettriche: in fondo c'è una sezione in più da scommentare.
# Senza il permesso "posizione" la mappa e "Parcheggiata dal" non ci sono: togli quelle card.

title: JaeDrive
views:
  - title: Auto
    path: auto
    icon: mdi:car
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Adesso
            icon: mdi:car-info
          - type: tile
            entity: sensor.jaedrive_battery
            name: Batteria
          - type: tile
            entity: sensor.jaedrive_fuel_level
            name: Carburante
          - type: tile
            entity: sensor.jaedrive_fuel_range
            name: Autonomia
          - type: tile
            entity: sensor.jaedrive_odometer
            name: Contachilometri
          - type: tile
            entity: sensor.jaedrive_status_updated
            name: Dati aggiornati
            grid_options:
              columns: 12

      - type: grid
        cards:
          - type: heading
            heading: Dove è parcheggiata
            icon: mdi:parking
          - type: map
            entities:
              - entity: device_tracker.jaedrive_park
            default_zoom: 15
            hours_to_show: 0
            theme_mode: auto
          - type: tile
            entity: sensor.jaedrive_parked_at
            name: Parcheggiata dal
            grid_options:
              columns: 12

      - type: grid
        cards:
          - type: heading
            heading: Ultimo viaggio
            icon: mdi:map-marker-path
          - type: tile
            entity: sensor.jaedrive_last_trip_distance
            name: Distanza
          - type: tile
            entity: sensor.jaedrive_last_trip_consumption
            name: Consumo
          - type: entities
            title: Dettagli
            entities:
              - type: attribute
                entity: sensor.jaedrive_last_trip_distance
                attribute: from
                name: Partenza
                icon: mdi:map-marker-outline
              - type: attribute
                entity: sensor.jaedrive_last_trip_distance
                attribute: to
                name: Arrivo
                icon: mdi:flag-checkered
              - type: attribute
                entity: sensor.jaedrive_last_trip_distance
                attribute: ended_at
                name: Arrivata
                icon: mdi:clock-outline
                format: relative
              - type: attribute
                entity: sensor.jaedrive_last_trip_distance
                attribute: duration_min
                name: Durata
                icon: mdi:timer-outline
                suffix: min
              - type: attribute
                entity: sensor.jaedrive_last_trip_distance
                attribute: liters
                name: Carburante usato
                icon: mdi:gas-station
                suffix: L

      - type: grid
        cards:
          - type: heading
            heading: Ultimi 30 giorni
            icon: mdi:calendar-month
          - type: tile
            entity: sensor.jaedrive_distance_30d
            name: Percorsi
          - type: tile
            entity: sensor.jaedrive_consumption_30d
            name: Consumo medio
          # Solo ibride ed elettriche: per le altre togli questa card.
          - type: tile
            entity: sensor.jaedrive_ev_share_30d
            name: Km in elettrico
          - type: statistics-graph
            title: Chilometri al giorno
            entities:
              - sensor.jaedrive_odometer
            stat_types:
              - change
            chart_type: bar
            period: day
            days_to_show: 30
          - type: history-graph
            title: Batteria e carburante
            hours_to_show: 168
            entities:
              - entity: sensor.jaedrive_battery
                name: Batteria
              - entity: sensor.jaedrive_fuel_level
                name: Carburante

      - type: grid
        cards:
          - type: heading
            heading: Tagliando e abbonamento
            icon: mdi:wrench-clock
          - type: tile
            entity: sensor.jaedrive_service_due_date
            name: Tagliando entro
          - type: tile
            entity: binary_sensor.jaedrive_subscription_problem
            name: Abbonamento cloud
          - type: tile
            entity: sensor.jaedrive_subscription_expires
            name: Scadenza abbonamento
            grid_options:
              columns: 12
          - type: tile
            entity: sensor.jaedrive_last_seen
            name: Ultimo contatto dall'auto
            grid_options:
              columns: 12

      # Ibride plug-in (SHS-P) ed elettriche: scommenta questa sezione.
      # - type: grid
      #   cards:
      #     - type: heading
      #       heading: Elettrico
      #       icon: mdi:ev-station
      #     - type: tile
      #       entity: sensor.jaedrive_ev_range
      #       name: Autonomia elettrica
      #     - type: tile
      #       entity: sensor.jaedrive_electric_consumption_30d
      #       name: Consumo elettrico (30 gg)
      #     - type: tile
      #       entity: sensor.jaedrive_ev_distance_total
      #       name: Km elettrici totali
